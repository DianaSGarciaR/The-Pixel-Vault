<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Carrito | The Pixel Vault</title>

  <!-- BOOTSTRAP 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />

  <!-- ESTILOS  -->
  <link rel="stylesheet" href="styles/styles.css" />
  <link rel="stylesheet" href="styles/tienda.css" />

  <!-- FUENTES GOOGLE -->
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Pixelify+Sans:wght@400..700&family=Quantico:ital,wght@0,400;0,700;1,400;1,700&display=swap");
  </style>
</head>

<body>
  <!-- Navbar -->
  <main class="navThePixelVault"></main>

  <!-- SECCIÓN PRINCIPAL DEL CARRITO -->
  <section class="container my-5">
    <h2 class="section-title mb-4">CARRITO DE COMPRAS</h2>

    <div class="row g-4">


      <div class="col-lg-8">
        <div id="contenedor-carrito" class="row g-3">
        </div>
      </div>

      <!-- COLUMNA DERECHA: Resumen de Compra y Checkout (Sticky) -->
      <div class="col-lg-4 ">
        <div class="card bkcCheckout text-light border-accent p-4 position-sticky" style="top: 2rem;">
          <h4 class="text-uppercase mb-3 pb-2 border-bottom border-secondary fontstylecheckout">Resumen del Pedido</h4>

          <div class="d-flex justify-content-between mb-2 fs-6 text-secondary mb-1">
            <span>Subtotal</span>
            <span id="subtotal-carrito">$0 MXN</span>
          </div>

          <div class="d-flex justify-content-between mb-3 fs-6 text-secondary mb-1">
            <span>Envío</span>
            <span class="text-success fw-bold">Gratis</span>
          </div>

          <!-- Cupón de descuento -->
          <div class="input-group mb-3 mb-1">
            <input type="text" class="form-control bg-dark text-light border-secondary" placeholder="Código de cupón">
            <button class="btn btn-outline-info" type="button">Aplicar</button>
          </div>

          <hr class="border-secondary my-3" />

          <!-- Total -->
          <div class="d-flex justify-content-between align-items-center mb-4 mb-1">
            <span class="fs-5 fw-bold">TOTAL:</span>
            <span id="total-carrito" class="fs-3 text-cyan fw-bold">$0 MXN</span>
          </div>

          <!-- Botón de acción principal (CTA) -->
          <button type="button" class="btn btn-cyan btn-lg w-100 fw-bold text-uppercase py-3 mb-3 fontstylecheckout"
            data-toggle="modal" data-target="#modalPago">
            Proceder al Pago 🚀
          </button>
          <!-- Sellos de confianza / Métodos de pago -->
          <div class="mt-4 text-center text-muted small">
            <p class="mb-1">💳 Aceptamos tarjetas de débito, crédito y PayPal</p>
            <p class="mb-0">🔒 Compra 100% Segura y Encriptada</p>
          </div>
        </div>
      </div>

    </div>
  </section>
  <!-- Modal -->
  <div class="modal fade" id="modalPago" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
    aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalLabel">🛒 Proceder al pago</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <h3>Productos</h3>
          <!-- CARRUSEL-->
          <div id="carouselMultiple" class="carousel slide" data-bs-ends="stop"
            style="--bs-carousel-items: 3; --bs-carousel-items-gap: 1rem;">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselMultiple" data-bs-slide="prev"
                  style="--bs-carousel-control-icon-width: 1rem;">
                  <span class="carousel-icon-prev" aria-hidden="true"></span>
                  <span class="visually-hidden">Previous</span>
                </button>
                <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselMultiple" data-bs-slide="next"
                  style="--bs-carousel-control-icon-width: 1rem;">
                  <span class="carousel-icon-next" aria-hidden="true"></span>
                  <span class="visually-hidden">Next</span>
                </button>
              </div>
            </div>
            <div class="carousel-inner">
              <div class="carousel-item active"><img src="..." class="d-block w-100 rounded-5" alt="..."></div>
              <div class="carousel-item"><img src="..." class="d-block w-100 rounded-5" alt="..."></div>
              <div class="carousel-item"><img src="..." class="d-block w-100 rounded-5" alt="..."></div>
              <div class="carousel-item"><img src="..." class="d-block w-100 rounded-5" alt="..."></div>
              <div class="carousel-item"><img src="..." class="d-block w-100 rounded-5" alt="..."></div>
              <div class="carousel-item"><img src="..." class="d-block w-100 rounded-5" alt="..."></div>
              <div class="carousel-item"><img src="..." class="d-block w-100 rounded-5" alt="..."></div>
            </div>
          </div>
          <!--FIN CARRUSEL-->
          <!-- FORMULARIO-->
          <form>
            <h3>DATOS DE PAGO</h3>
            <div class="form-group">
              <label for="numtarjeta">Número de tarjeta</label>
              <input type="number" class="form-control" id="numtarjeta" aria-describedby="emailHelp"
                placeholder="1234 5678 9012 3456">
            </div>
            <div class="form-group row">
              <div class="col-sm-6">
                <label for="expdate">Fecha de expiración</label>
                <input type="month" class="form-control" id="expdate" aria-describedby="emailHelp"
                  placeholder="...">
              </div>
              <div class="col-sm-6">
                <label for="cvv">CVV</label>
                <input type="number" class="form-control" id="cvv" aria-describedby="emailHelp"
                  placeholder="123">
              </div>
            </div>
            <div class="form-group">
              <label for="nombretitular">Nombre del titular</label>
              <input type="text" class="form-control" id="nombretitular" aria-describedby="emailHelp"
                placeholder="Nombre como aparece en la tarjeta">
            </div>
            <h3>DIRECCIÓN DE ENVÍO</h3>
            <!--Dirección-->
<!-- Fila 5: Calle y Número -->
  <div class="row">
    <div class="col-8">
      <div class="mb-1">
        <label for="calle" class="form-label">Calle</label><br>
        <input name="calle" type="text" class="form-control" id="calle" placeholder="Calle">
      </div>
    </div>
    <div class="col-4">
      <div class="mb-1">
        <label for="numero" class="form-label">Número</label><br>
        <input name="numero" type="text" class="form-control" id="numero" placeholder="11">
      </div>
    </div>
  </div>

  <!-- Fila 6: Colonia y Municipio -->
  <div class="row">
    <div class="col-6">
      <div class="mb-1">
        <label for="colonia" class="form-label">Colonia/Alcaldía</label><br>
        <input name="colonia" type="text" class="form-control" id="colonia" placeholder="Colonia">
      </div>
    </div>
    <div class="col-6">
      <div class="mb-1">
        <label for="municipio" class="form-label">Municipio</label><br>
        <input name="municipio" type="text" class="form-control" id="municipio" placeholder="Municipio">
      </div>
    </div>
  </div>

  <!-- Fila 7: Estado, País y C.P. -->
  <div class="row">
    <div class="col-5">
      <div class="mb-1">
        <label for="estado" class="form-label">Estado/Ciudad</label><br>
        <input name="estado" type="text" class="form-control" id="estado" placeholder="Estado/Ciudad">
      </div>
    </div>
    <div class="col-4">
      <div class="mb-1">
        <label for="pais" class="form-label">País</label><br>
        <input name="pais" type="text" class="form-control" id="pais" placeholder="País">
      </div>
    </div>
    <div class="col-3">
      <div class="mb-1">
        <label for="postal" class="form-label">C.P.</label><br>
        <input name="postal" type="number" class="form-control" id="postal" placeholder="00000">
      </div>
    </div>
  </div>
            <!--Fin dirección-->
          <h3>DIRECCIÓN DE FATCTURACIÓN</h3>
            <div class="form-check">
              <input type="checkbox" class="form-check-input" id="exampleCheck1">
              <label class="form-check-label" for="exampleCheck1">Check me out</label>
            </div>
          </form>
          <!--FIN FORMULARIO-->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary">Save changes</button>
        </div>
      </div>
    </div>
  </div>
  <!-- Footer -->
  <footer class="footer-container"></footer>


  <script src="./javascript/globalElements.js"></script>
  <script src="./javascript/contactanos.js"></script>
  <script src="./javascript/productosJSON.js"></script>
  <script type="module" src="./javascript/tienda.js"></script>
  <script type="module" src="/javascript/carrito.js"></script>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
    integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js"
    integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js"
    integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy"
    crossorigin="anonymous"></script>
</body>

</html>
