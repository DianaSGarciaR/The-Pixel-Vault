    @import url("https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Pixelify+Sans:wght@400..700&family=Quantico:ital,wght@0,400;0,700;1,400;1,700&display=swap");

<body>
  <!--* --------- INICIO: navbar --------- -->
  <main class="navThePixelVault"></main>
  <!--* ---------- FIN: navbar ----------- -->

  <!--* -------- INICIO : Banner Principal -------- -->
  <section class="banner-container">
    <!-- Imagen de fondo-->
    <img class="banner-frame" src="./assets/banner-img.png"
      alt="Marco del Banner"><!--Se agregó el ./ a la ruta del archivo (Beto)-->
    <!-- Contenedor de la pantalla central con los botones -->
    <div class="banner-screen">
      <h3 href="acercaNosotros.html" class="yellow-accent btn-yellow head" class="head">LOGIN</h3>
      </nav>
    </div>
  </section>
  <!--* --------- FIN : Banner Principal ---------- -->

  <!--* --------- INICIO : Iniciar sesion ---------- -->
  <section>
    <div class="contenedor-pixel">
      <div class="capa-blur"></div>
      <svg class="marcoAzul" viewBox="0 0 64 33" preserveAspectRatio="none">
        <use href="#plantillaSVG"></use>
      </svg>
      <div class="contenido row" id="groupItems">
        <div id="seccionInfo" class="col-12 col-lg-4">
          <h3>The Pixel Vault</h3>
          <p text-center>
            Tu aventura comienza aquí.
            Explora los lanzamientos más recientes,
            consigue productos únicos y conecta
            con otros apasionados del gaming.
          </p>
        </div>
        <div id="sectionLogin" class="col-12 col-lg-8 view-element">
          <h4>Bienvenido de nuevo</h4>
          <form>
            <div class="mb-3">
              <label for="exampleInputEmail1" class="form-label">Usuario</label>
              <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp"
                placeholder="ejemplo@gmail.com">
            </div>
            <div class="mb-3">
              <label for="forInputPassword" class="form-label">Password</label>
              <input type="password" id="inputPassword" name="password" class="form-control">
            </div>
            <button type="submit" class="btn btn-Light">Inisiar sesion</button>
            <div id="emailHelp" class="form-text">Crear cuenta</div>
          </form>
        </div>

        <div id="sectionCreateUser" class="col-12 col-lg-8 view-element">
          <div id="registreLoginForm">
            <h4>REGISTRATE</h4>
            <form>
              <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Usuario</label>
                <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp"
                  placeholder="ejemplo@gmail.com">
              </div>
              <div class="mb-3">
                <label for="forInputPassword" class="form-label">Password</label>
                <input type="password" id="inputPassword" name="password" class="form-control">
              </div>

              <div class="mb-3">
                <label for="forInputPasswordConfirm" class="form-label">Confirmacion de contraseña</label>
                <input type="passwordConfirm" id="inputPassword" name="passwordConfirm" class="form-control">
              </div>

              <div class="mb-3">
                <button type="submit" class="btn btn-Light">Crear</button>
                <div id="emailHelp" class="form-text">Inicia sesion</div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>
