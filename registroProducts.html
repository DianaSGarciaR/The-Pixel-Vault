<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de productos</title>
    <!-- !LINK BOOSTRAP-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- !FIN LINK BOOSTRAP-->
    <link rel="stylesheet" href="./styles/registroProducts.css">
    <link rel="stylesheet" href="./styles/styles.css">
    <!--Link de fuente-->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Pixelify+Sans:wght@400..700&family=Quantico:ital,wght@0,400;0,700;1,400;1,700&display=swap');
    </style>
</head>

<body>
    <!--* --------- INICIO: navbar --------- -->
    <main class="navThePixelVault"></main>
    <!--* --------- FIN: navbar --------- -->
<br>
    <!-- Banner principal de la página. -->
    <section class="banner-container">
    <!-- Imagen de fondo -->
    <img class="banner-frame" src="./assets/banner-img.webp" alt="Marco del Banner">
    <div class="banner-screen">
            <h3 class="yellow-accent btn-yellow head">Registrar <br> productos</h3>
    </div>
</section>

    <div class="frame-demo" id="frameDemo">
        <!-- El marco amarillo ya no vive aquí: lo dibuja el CSS (.frame-demo::before) con un SVG -->

        <!-- Todos los campos van dentro de .frame-content: es lo que los separa del marco -->
        <div class="frame-content">

            <!--* Inicio de formulario -->
            <form id="registro-products-form" autocomplete="off">
            <div class="mb-3 row">
                <label for="name" class="col-sm-3 col-form-label titulo-campo">Nombre:</label>
                <div class="col-sm-9">
                    <input type="text" class="form-control" id="name" name="name"
                        placeholder="Nombre del producto" required><!--required para que sean obligatorios los campos-->
                </div>
            </div>

            <div class="mb-3 row">
                <label for="tipo" class="col-sm-3 col-form-label titulo-campo">Tipo:</label>
                <div class="col-sm-9">
                    <select class="form-select" aria-label="Default select example" id="tipo" name="tipo" required>
                        <option selected value="" disabled>Tipo de producto</option>
                        <option value="1">Videojuegos</option>
                        <option value="2">Merch</option>
                    </select>
                </div>
            </div>

            <!--Botón de categoría-->
            <div class="mb-3 row">
                <label for="categoryName" class="col-sm-3 col-form-label titulo-campo">Categoría:</label>
                <div class="col-sm-9">
                    <select class="form-select" aria-label="Default select example" id="categoryName" name="categoryName" required>
                        
                    </select>
                </div>
            </div>

            <!-- Función para cambiar dinámicamente las opciones de las categorías dependiendo de si son Videojuegos o Merch -->
            <script>
                //Se eligen los elementos del DOM que vamos a ocupar: el seleccionador del tipo para saber cuál se escogió y el de categoría para renderizar ahí la lista adecuada
                const tipoElement = document.querySelector("#tipo");
                const categoriaElement = document.querySelector("#categoryName")
                
                //Se hacen las dos listas de opciones, dependiendo del tipo de producto
                const opcionesCategoriasVideojuegos = `
                    <option selected value="" disabled>Selecciona la categoría del producto</option>
                    <option value="3">Físico</option>
                    <option value="4">Digital</option>
                    <option value="5">Edición Especial</option>
                    `;
                const opcionesCategoriasMerch = `
                    <option selected value="" disabled>Selecciona la categoría del producto</option>
                    <option value="6">CDs y Viniles</option>
                    <option value="7">Peluches</option>
                    <option value="8">Arte y Pósters</option>
                    <option value="9">Accesorios</option>
                    <option value="10">Ropa y Calzado</option>
                `;

                //Se escucha qué opción se eligió en el seleccionador de tipo y dependiendo de la que escogieron se renderiza la lista pertinente
                tipoElement.addEventListener("change",(e)=>{
                    const valorSeleccionado = e.target.value;
                    if(valorSeleccionado==2){
                        categoriaElement.innerHTML = "";
                        categoriaElement.insertAdjacentHTML("beforeend",opcionesCategoriasMerch);
                    }else{
                        categoriaElement.innerHTML = "";
                        categoriaElement.insertAdjacentHTML("beforeend",opcionesCategoriasVideojuegos);
                    }
                });
            </script>


            <div class="mb-3 row">
                <label for="image" class="col-form-label col-sm-3 titulo-campo">Imagen:</label>
                <div class="col-sm-9">
                    <input type="text" class="form-control" id="image" name="image"
                        placeholder="Ruta a la imagen" required><!--required para que sean obligatorios los campos-->
                </div>
            </div>


            <div class="mb-3 row">
                <label for="description" class="col-sm-3 col-form-label titulo-campo">Descripción:</label>
                <div class="col-sm-9">
                    <textarea class="form-control" id="description" rows="3" name="description"
                        placeholder="Escribe una breve descripción del producto" required></textarea>
                </div>
            </div>


            <div class="mb-3 row">
                <label for="price" class="col-sm-3 col-form-label titulo-campo">Precio:</label>
                <div class="col-sm-9">
                    <div class="input-group">
                        <span class="input-group-text">$</span>
                        <input type="number" class="form-control sin-flechas" id="price" name="price" min="0"
                            aria-label="Amount (to the nearest dollar)" required>
                        <span class="input-group-text">.00</span>
                    </div>
                </div>
            </div>

            <div class="mb-3 row">
                <label for="attributes" class="col-sm-3 col-form-label titulo-campo">Género:</label>
                <div class="col-sm-9">
                    <input type="text" class="form-control" id="attributes" name="attributes"
                        placeholder="Género del producto" required>
                </div>
            </div>

            <div class="mb-3 row">
                <label for="game" class="col-sm-3 col-form-label titulo-campo">Consola:</label>
                <div class="col-sm-9">
                    <input type="text" class="form-control" id="game" name="game"
                        placeholder="Dónde se puede jugar" required>
                </div>
            </div>

            <div class="mb-3 row">
                <label for="stock" class="form-label col-sm-3 titulo-campo">Stock:</label>
                <div class="col-sm-9">
                    <input type="number" class="form-control sin-flechas" id="stock" name="stock" list="opcionesNumero" min="1"
                        max="20" placeholder="Número de piezas existentes" required>
                </div>
            </div>

            <div class="mb-3 row">
                <label for="rating" class="col-sm-3 col-form-label titulo-campo">Calificación:</label>
                <div class="col-sm-9">
                    <select class="form-select" aria-label="Default select example" id="rating" name="rating" required>
                        <option selected value=""  disabled>Calificación del producto</option>
                        <option value="1">⭐</option>
                        <option value="2">⭐⭐</option>
                        <option value="3">⭐⭐⭐</option>
                        <option value="4">⭐⭐⭐⭐</option>
                        <option value="5">⭐⭐⭐⭐⭐</option>

                    </select>
                </div>
            </div>

            <button type="submit" class="btn btn-fucsia">Guardar</button>
            <div id="resultadoRegistro"></div>
            </form>

        </div>
        <!-- FIN de .frame-content -->

    </div>

    <!--* --------- INICIO: navbar --------- -->
    <footer class="footer-container"></footer>
    <!--* --------- FIN: navbar --------- -->

    <!-- ! ENLACES DE ARCHIVOS JAVASCRIP-->
    <script src="./javascript/globalElements.js"></script>
    <script type="module" src="./javascript/registroProducts.js"></script>
    <!-- ! FIN DE ENLACES DE ARCHIVOS JAVASCRIP-->
    <!-- !LINK BOOSTRAP-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <!-- !FIN LINK BOOSTRAP-->
</body>

</html>
