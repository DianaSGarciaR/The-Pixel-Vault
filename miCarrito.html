<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Carrito | The Pixel Vault</title>

    <!-- BOOTSTRAP 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    
    <!-- ESTILOS PROPIOS -->
    <link rel="stylesheet" href="styles/contactanos.css" />
    <link rel="stylesheet" href="styles/styles.css" />
    <link rel="stylesheet" href="styles/tienda.css" />

    <!-- FUENTES GOOGLE -->
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Pixelify+Sans:wght@400..700&family=Quantico:ital,wght@0,400;0,700;1,400;1,700&display=swap");
    </style>
  </head>

  <body>
    <!-- Navbar -->
    <main class="navThePixelVault"></main>

    <!-- SECCIÓN PRINCIPAL DEL CARRITO -->
    <section class="container my-5">
      <h2 class="section-title mb-4">CARRITO DE COMPRAS</h2>

      <div class="row g-4">
        
        
        <div class="col-lg-8">
         <div id="contenedor-carrito" class="row g-3">
            <!-- JavaScript renderizará los productos aquí como filas/tarjetas horizontales -->
          </div>
        </div>

        <!-- COLUMNA DERECHA: Resumen de Compra y Checkout (Sticky) -->
        <div class="col-lg-4">
          <div class="card bg-dark text-light border-accent p-4 position-sticky" style="top: 2rem;">
            <h4 class="text-uppercase mb-3 pb-2 border-bottom border-secondary">Resumen del Pedido</h4>
            
            <div class="d-flex justify-content-between mb-2 fs-6 text-secondary">
              <span>Subtotal</span>
              <span id="subtotal-carrito">$0 MXN</span>
            </div>
            
            <div class="d-flex justify-content-between mb-3 fs-6 text-secondary">
              <span>Envío</span>
              <span class="text-success fw-bold">Gratis</span>
            </div>

            <!-- Cupón de descuento -->
            <div class="input-group mb-3">
              <input type="text" class="form-control bg-dark text-light border-secondary" placeholder="Código de cupón">
              <button class="btn btn-outline-info" type="button">Aplicar</button>
            </div>

            <hr class="border-secondary my-3" />

            <!-- Total -->
            <div class="d-flex justify-content-between align-items-center mb-4">
              <span class="fs-5 fw-bold">TOTAL:</span>
              <span id="total-carrito" class="fs-3 text-cyan fw-bold">$0 MXN</span>
            </div>

            <!-- Botón de acción principal (CTA) -->
            <button class="btn btn-cyan btn-lg w-100 fw-bold text-uppercase py-3">
              Proceder al Pago 🚀
            </button>

            <!-- Sellos de confianza / Métodos de pago -->
            <div class="mt-4 text-center text-muted small">
              <p class="mb-1">💳 Aceptamos tarjetas de débito, crédito y PayPal</p>
              <p class="mb-0">🔒 Compra 100% Segura y Encriptada</p>
            </div>
          </div>
        </div>

      </div>
    </section>

    <!-- Footer -->
    <footer class="footer-container"></footer>

    <!-- SCRIPTS -->
    <script src="./javascript/globalElements.js"></script>
    <script src="./javascript/contactanos.js"></script>
    <script src="./javascript/productosJSON.js"></script>
    <script type="module" src="./javascript/tienda.js"></script>
    <script type="module" src="/javascript/carrito.js"></script>
    
    <!-- BOOTSTRAP BUNDLE JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
